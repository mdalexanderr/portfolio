<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alexweb — Full Stack Web Developer</title>
    <script type="text/javascript">
      // GitHub Pages returns this file for any path it can't serve (e.g. a
      // direct visit or refresh of /portfolio/projects or /portfolio/contact).
      // Remember the requested path, then load the real app root, where the
      // snippet in index.html restores it so react-router renders the page.
      sessionStorage.redirect = location.pathname + location.search
      location.replace('/portfolio/')
    </script>
  </head>
  <body></body>
</html>
